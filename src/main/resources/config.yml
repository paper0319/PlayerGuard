protection:
  # 保護できる総体積の上限（プレイ日数に応じた段階制）。
  #   キー = プレイ日数(0以上の整数), 値 = その日数以降の上限体積。
  #   プレイヤーのプレイ日数「以下」で最も近いキーが採用される。
  #   例) キーが 0/1/2 のみで7日目のプレイヤー → キー2の値が適用される。
  # 各値は自由に変更してよい。
  # 8日目以降の上限を増やしたい場合は、下に "8: 110000" のように行を追加するだけで効く。
  limit:
    0: 30000    # プレイ0日目以降（初日）
    1: 40000    # プレイ1日目以降
    2: 50000    # プレイ2日目以降
    3: 60000    # プレイ3日目以降
    4: 70000    # プレイ4日目以降
    5: 85000    # プレイ5日目以降
    6: 100000    # プレイ6日目以降
    7: 120000   # プレイ7日目以降（以降は新しいキーを追記すると拡張できる）

  creation-confirmation:
    default-mode: GUI
    chat-timeout-seconds: 600

  paid-extension:
    enabled: true
    rates:
      120000: 0.01
      200000: 0.02
      300000: 0.04
      500000: 0.08
    allow-refund-on-delete: true
    refund-rate: 0.5
    refund-policy:
      enabled: true
      cooling-off-minutes: 30
      cooling-off-rate: 1.0
      normal-period-days: 7
      normal-refund-rate: 0.8
      long-term-refund-rate: 0.5

  teleport:
    enabled: true
    setup-cost: 1000.0
    teleport-cost: 300.0

  # 進入できない保護へ入ろうとしたとき、画面中央にタイトルを出し入場を止める。
  # 徒歩は境界で停止。ジャンプ・エリトラ等は外側の近くへ退避する
  # （WorldGuard の空中引き戻しはアンチチートの飛行キックの原因になる）。
  denied-entry-relocation:
    enabled: true
    search-radius: 8
    search-down: 48

  # 保護ごとのプレイヤーブラックリスト。登録されたプレイヤーは
  # メンバーであっても侵入・建築・操作を拒否される。
  blacklist:
    enabled: true

  flags:
    break: true
    place: true
    interact: true
    pvp: true
    entity-damage: true
    entry: true
    pistons: true
    explosion: true
    fire: true
    mob-spawning: true
    item: true
    environment: true

  spacing:
    min-spacing-between-regions: 0
    apply-to-same-player-s-region: false

  logs:
    enabled: true
    max-entries-per-protection: 1000
    visitor-log-enabled: true
    visitor-log-max-entries: 300

visitor-log:
  enabled: true
  max-entries-per-region: 100
  flush-interval-seconds: 60
  target: visitors-only
  events:
    enter-exit: true
    break: true
    place: true
    interact: true
  permissions:
    allow-subowner-view: true
    allow-builder-view: false

permissions:
  allow-subowner-transfer: false
  allow-subowner-disclaim: false
